[project]
name = "lobplatform"
version = "0.1.0"
description = "Risk-tiered algorithmic paper-trading platform (engine + API)"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.21",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "structlog>=24.1",
    "exchange-calendars>=4.5",
    "numpy>=1.26",
    "pandas>=2.0",
    "torch>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "redis>=5.0",
    "psycopg2-binary>=2.9",
    "aiosqlite>=0.20",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10", "hypothesis>=6.100"]

[project.scripts]
lobctl = "lobplatform.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["engine"]
include = ["lobplatform*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["research", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["engine/lobplatform", "api/app"]
ignore_missing_imports = true
exclude = ["research", "web"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["engine/tests", "api/tests"]
